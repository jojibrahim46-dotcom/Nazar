<style>
:root{
  --black:#0a0a0a; --black-2:#141210; --gold:#d4af37; --gold-light:#f3e2a0; --gold-dark:#8a6d1b;
  --text:#f5ecd0; --muted:#b9a76a;
  --gold-grad:linear-gradient(135deg,#8a6d1b 0%,#d4af37 30%,#f3e2a0 50%,#d4af37 70%,#8a6d1b 100%);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif;
  background:radial-gradient(ellipse at 50% 0%,#241c08 0%,var(--black) 60%) fixed;
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  padding:max(20px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));
}
.card{
  width:100%;max-width:440px;position:relative;
  background:linear-gradient(160deg,var(--black-2),var(--black));
  border-radius:24px;padding:40px 28px 32px;text-align:center;
  border:1px solid rgba(212,175,55,.45);
  box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 6px rgba(212,175,55,.06),inset 0 0 60px rgba(212,175,55,.05);
  overflow:hidden;
}
.card::before{ /* inner frame */
  content:"";position:absolute;inset:10px;border-radius:16px;
  border:1px solid rgba(212,175,55,.25);pointer-events:none;
}
.card::after{ /* shine */
  content:"";position:absolute;top:-60%;left:-40%;width:60%;height:220%;
  background:linear-gradient(90deg,transparent,rgba(243,226,160,.07),transparent);
  transform:rotate(20deg);animation:shine 7s ease-in-out infinite;pointer-events:none;
}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
.monogram{
  width:96px;height:96px;margin:0 auto 22px;border-radius:50%;
  background:var(--gold-grad);padding:3px;
  box-shadow:0 0 30px rgba(212,175,55,.35);
}
.monogram span{
  width:100%;height:100%;border-radius:50%;background:var(--black);
  display:flex;align-items:center;justify-content:center;
  font-size:46px;font-weight:800;
  background-image:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  background-color:var(--black);
}
.monogram span{background:var(--black);position:relative}
.monogram span b{
  background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
  font-weight:800;line-height:1;
}
h1{
  font-size:clamp(22px,6vw,28px);font-weight:800;line-height:1.5;
  background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.divider{
  display:flex;align-items:center;gap:12px;margin:20px auto 26px;max-width:220px;
}
.divider i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.divider em{width:8px;height:8px;background:var(--gold);transform:rotate(45deg);display:block}
.row{
  display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text);
  padding:14px 16px;margin-bottom:12px;border-radius:14px;text-align:right;
  background:rgba(212,175,55,.05);border:1px solid rgba(212,175,55,.25);
  transition:transform .2s,border-color .2s,background .2s;
}
.row:hover,.row:focus-visible{transform:translateY(-2px);border-color:var(--gold);background:rgba(212,175,55,.1);outline:none}
.ico{
  flex:0 0 44px;height:44px;border-radius:12px;background:var(--gold-grad);
  display:flex;align-items:center;justify-content:center;
}
.ico svg{width:22px;height:22px;fill:var(--black)}
.info{min-width:0;flex:1}
.info small{display:block;color:var(--muted);font-size:13px;margin-bottom:2px}
.info strong{display:block;font-size:17px;font-weight:700;direction:ltr;text-align:right;overflow-wrap:anywhere}
.save{
  width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:18px;font-weight:800;color:var(--black);
  background:var(--gold-grad);background-size:200% 100%;
  display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 10px 30px rgba(212,175,55,.3);
  transition:transform .2s,background-position .6s,box-shadow .2s;
}
.save:hover,.save:focus-visible{background-position:100% 0;transform:translateY(-2px);box-shadow:0 14px 36px rgba(212,175,55,.45);outline:none}
.save:active{transform:scale(.98)}
.save svg{width:22px;height:22px;fill:var(--black)}
.toast{
  min-height:22px;margin-top:12px;font-size:14px;color:var(--gold-light);opacity:0;transition:opacity .3s;
}
.toast.show{opacity:1}
@media (max-width:380px){
  .card{padding:34px 18px 26px}
  .info strong{font-size:15px}
}
@media (min-width:768px){ .card{padding:48px 40px 38px} }
@media (prefers-reduced-motion:reduce){ .card::after{animation:none} *{transition:none!important} }
</style>
</head>

<script>
(function(){
